<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#C67C63">

    <title>DoceCantinho - Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #F8F5F2;
            font-family: Arial, sans-serif;
            color: #3D302B;
        }

        .offline {
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #C67C63;
            border-radius: 20px;
            font-size: 36px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 25px;
            line-height: 1.6;
            color: #756963;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            background: #C67C63;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="offline">

        <div class="icon">
            🍰
        </div>

        <h1>Você está offline</h1>

        <p>
            Não foi possível conectar ao DoceCantinho.
            Verifique sua conexão com a internet e tente novamente.
        </p>

        <button onclick="location.reload()">
            Tentar novamente
        </button>

    </div>

</body>
</html>
